<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Media Upload</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="hero-content">
        <span class="badge">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
          GITHUB MEDIA
        </span>
        <h1>Nurul Ikhwan Media Upload</h1>
        <p>Tautan Langsung Gambar, Video dan Audio</p>
      </div>
      <div class="limit">
        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Maks. <strong>25 MB</strong>
      </div>
    </header>

    <section class="card">
      <h2>
        <svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload File
      </h2>

      <form id="uploadForm">
        <div class="form-group">
          <label for="visitor">Nama Pemilik <span>*</span></label>
          <input id="visitor" required maxlength="150" placeholder="Tulis nama pemilik">
        </div>

        <div class="form-group">
          <label for="type">Jenis File <span>*</span></label>
          <select id="type" required>
            <option value="">-- Pilih jenis file --</option>
            <option value="gambar">🖼️ Gambar</option>
            <option value="video">🎬 Video</option>
            <option value="audio">🎵 Audio</option>
          </select>
        </div>

        <div class="form-group">
          <label for="file">Pilih File <span>*</span></label>
          <input id="file" type="file" required disabled>
        </div>

        <div id="fileInfo" class="file-info hidden"></div>

        <div class="form-group">
          <label for="customName">Nama File <small>(opsional)</small></label>
          <input id="customName" maxlength="255" placeholder="Kosongkan untuk memakai nama file asli">
        </div>

        <button id="uploadBtn" class="primary" type="submit">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload
        </button>

        <div class="progress-wrap hidden" id="progressWrap">
          <div class="progress"><div id="progressBar"></div></div>
          <div id="progressText">Menyiapkan...</div>
        </div>
      </form>

      <div id="uploadResult"></div>
    </section>

    <section class="card">
      <h2>
        <svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Pencarian File
      </h2>

      <div class="search-grid">
        <div class="form-group">
          <label for="searchMode">Cari Berdasarkan</label>
          <select id="searchMode">
            <option value="name">Nama File</option>
            <option value="visitor">Nama Pemilik</option>
          </select>
        </div>
        <div class="form-group">
          <label for="searchQuery">Kata Pencarian</label>
          <input id="searchQuery" placeholder="Tulis nama file atau pemilik">
        </div>
      </div>

      <button id="searchBtn" class="secondary">
        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Cari File
      </button>
      <div id="searchResult"></div>
    </section>

    <footer>
      <span>GitHub + Google Spreadsheet</span>
      <span>•</span>
      <span>Batas aplikasi: 25 MB/file</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
